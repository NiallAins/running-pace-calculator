<!DOCTYPE html>
<html lang="en">

<html>

<head>
    <title>
        Pace Calculator
    </title>

    <meta
        name="viewport"
        content="width=device-width"
    />
    
    <link
        rel="stylesheet" 
        href="style.css"
    />
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="./icons/apple-touch-icon.png"
    />
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="./icons/favicon-32x32.png"
    />
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="./icons/favicon-16x16.png"
    />
    <link
        rel="manifest"
        href="./manifest.json"
    />
</head>

<body tabindex="0">
    <div class="app">
        <div class="input__title">
            Distance
        </div>
        <div class="input__field input__field--dist">
            <input
                id="INP_DIST"
                type="number"
                inputmode="decimal"
                pattern="[0-9.]*"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-end"
            />
            <span
                id="EL_DIST_UNITS"
                class="input__units"
                aria-hidden="true"
            ></span>
        </div>
        <div class="button__container">
            <button
                id="INP_DIST_MARATHON"
                class="button"
                aria-label="Input marathon distance"
            >
                Marathon
            </button>
            <button
                id="INP_DIST_HALF"
                class="button"
                aria-label="Input half marathon distance"
            >
                Half
            </button>
            <button
                id="INP_DIST_BACKYARD"
                class="button"
                aria-label="Input backyard lap distance"
            >
                Backyard
            </button>
        </div>

        <div class="input__title">
            Pace
        </div>
        <div class="input__field input__field--pace">
            <input
                id="INP_PACE_MIN"
                type="number"
                inputmode="numeric"
                pattern="[0-9][0-9]"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-end"
            />
            <div class="input__seperator">:</div>
            <input
                id="INP_PACE_SEC"
                type="number"
                inputmode="numeric"
                pattern="[0-9][0-9]"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-end input--open-start"
            />
            <span
                class="input__units"
                aria-hidden="true"
            >
                <span class="input__units--slash">/</span>
                <span id="EL_PACE_UNITS"></span>
            </span>
        </div>
        <div class="input__micro">
            <span></span>
            <span id="EL_PACE_SPEED_SM"></span>
            <span id="EL_PACE_SPEED_LG"></span>
        </div>

        <div class="input__title">
            Time
        </div>
        <div class="input__field input__field--time">
            <input
                id="INP_TIME_HR"
                type="number"
                inputmode="numeric"
                pattern="[0-9]*"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-end"
                aria-label="time: hours"
            />
            <div class="input__seperator">:</div>
            <input
                id="INP_TIME_MIN"
                type="number"
                inputmode="numeric"
                pattern="[0-9][0-9]"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-start input--open-end"
                aria-label="time: minutes"
            />
            <div class="input__seperator">:</div>
            <input
                id="INP_TIME_SEC"
                type="number"
                inputmode="numeric"
                pattern="[0-9][0-9]"
                spellcheck="false"
                autocomplete="off"
                class="input input--open-start"
                aria-label="time: seconds"
            />
        </div>

        <div class="input__title">
            Projected
        </div>
        <div
            id="EL_PREDICTED"
            class="predicted"
        ></div>
        
        <div class="input__title">
            Units
        </div>
        <div class="radio__container">
            <input
                id="INP_UNIT_KM"
                type="radio"
                name="unit"
                value="metric"
                class="radio"
            />
            <label for="INP_UNIT_KM">
                Kilometers
            </label>
            <input
                id="INP_UNIT_MI"
                type="radio"
                name="unit"
                value="imperial"
                class="radio"
            />
            <label for="INP_UNIT_MI">
                Miles
            </label>
        </div>
    </div>

    <button
        id="EL_DOWNLOAD"
        class="download"
        ></button>
        <!-- hidden -->
    <script src="script.js"></script>
</body>

</html>
